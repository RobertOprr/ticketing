# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploys the Django API and the React static build as two services.
# MySQL isn't a Render-managed database type, so DB_* vars point at
# whatever external MySQL host you provision (Aiven, Railway, etc.) —
# fill them in via the Render dashboard after the first deploy. If your
# host requires SSL (e.g. Aiven), upload its CA cert as a Render Secret
# File named aiven-ca.pem — it lands at /etc/secrets/aiven-ca.pem, which
# DB_SSL_CA below already points at. DJANGO_SUPERUSER_* creates the first
# login and seed categories via `manage.py seed_production` in the build
# command — free-tier Render has no shell for `createsuperuser`.
services:
  - name: helpdesk-backend
    type: web
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py seed_production"
    startCommand: "gunicorn helpdesk_backend.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_NAME
        sync: false
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: helpdesk-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://helpdesk-frontend-idzb.onrender.com
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        sync: false
      - key: DB_SSL_CA
        value: /etc/secrets/aiven-ca.pem

  - name: helpdesk-frontend
    type: web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        value: https://helpdesk-backend.onrender.com/api
    routes:
      - source: "/*"
        destination: /index.html
